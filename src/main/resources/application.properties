spring.application.name=expense-platform

# ─── MySQL ───────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/expense_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ─── Thymeleaf ───────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ─── File Upload ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
file.upload-dir=./uploads

# ─── Server ──────────────────────────────────────────────────────────────────────
server.port=8080
server.error.whitelabel.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ─── Logging ─────────────────────────────────────────────────────────────────────
logging.level.com.company.expenseplatform=INFO
logging.level.org.springframework.security=WARN
