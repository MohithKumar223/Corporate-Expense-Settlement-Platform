<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Employee Profile</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <h2 class="mb-0" th:text="${employee.fullName}">John Doe</h2>
                    <span class="badge" th:classappend="${employee.active ? 'bg-success' : 'bg-danger'}"
                          th:text="${employee.active ? 'Active' : 'Inactive'}">Active</span>
                </div>
                <p class="text-muted mb-0" th:text="${employee.designation + ' • ' + employee.department}">Designation</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/employees}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Directory
                </a>
                <a th:href="@{'/employees/edit/' + ${employee.id}}" class="btn btn-navy">
                    <i class="bi bi-pencil me-1"></i> Edit Profile
                </a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card mb-4">
                    <h5 class="fw-bold text-navy mb-4 border-bottom pb-2">Profile Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Employee Code</span>
                            <strong th:text="${employee.employeeCode}">EMP-100</strong>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Email Address</span>
                            <strong th:text="${employee.email}">john@company.com</strong>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Department</span>
                            <span th:text="${employee.department}">Engineering</span>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Designation</span>
                            <span th:text="${employee.designation}">Senior Developer</span>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Platform Role</span>
                            <span class="badge"
                                  th:classappend="${employee.role.name() == 'FINANCE_ADMIN' ? 'bg-primary' : (employee.role.name() == 'MANAGER' ? 'bg-info text-dark' : 'bg-secondary')}"
                                  th:text="${employee.role}">EMPLOYEE</span>
                        </div>
                        <div class="col-md-6">
                            <span class="text-muted small d-block">Reporting Manager</span>
                            <span th:text="${employee.manager != null ? employee.manager.fullName : 'None (Self / Executive)'}">Manager</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
