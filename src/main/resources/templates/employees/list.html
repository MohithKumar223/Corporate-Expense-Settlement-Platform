<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Employee Directory</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <div>
                <h2>Employee Directory</h2>
                <p class="text-muted mb-0">Manage corporate staff, reporting managers, and platform access roles</p>
            </div>
            <div>
                <a th:href="@{/employees/create}" class="btn btn-navy">
                    <i class="bi bi-person-plus me-1"></i> Add Employee
                </a>
            </div>
        </div>

        <div class="data-table-wrapper">
            <div class="table-header">
                <h5>All Employees</h5>
                <input type="text" id="tableSearch" class="form-control form-control-sm" placeholder="Search employees..." style="max-width: 200px;">
            </div>
            <div class="table-responsive">
                <table class="table align-middle" id="dataTable">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Reporting Manager</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="9" class="text-center py-4 text-muted">
                                <i class="bi bi-people fs-3 d-block mb-1"></i> No employees registered
                            </td>
                        </tr>
                        <tr th:each="emp : ${employees}">
                            <td class="fw-bold" th:text="${emp.employeeCode}">EMP-100</td>
                            <td class="fw-semibold" th:text="${emp.fullName}">John Doe</td>
                            <td class="text-muted" th:text="${emp.email}">john@company.com</td>
                            <td th:text="${emp.department}">Engineering</td>
                            <td th:text="${emp.designation}">Senior Developer</td>
                            <td th:text="${emp.manager != null ? emp.manager.fullName : '-'}">-</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${emp.role.name() == 'FINANCE_ADMIN' ? 'bg-primary' : (emp.role.name() == 'MANAGER' ? 'bg-info text-dark' : 'bg-secondary')}"
                                      th:text="${emp.role}">EMPLOYEE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${emp.active ? 'bg-success' : 'bg-danger'}"
                                      th:text="${emp.active ? 'Active' : 'Inactive'}">Active</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{'/employees/view/' + ${emp.id}}" class="btn btn-outline-primary" title="View Profile">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/employees/edit/' + ${emp.id}}" class="btn btn-outline-secondary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${emp.active}" th:action="@{'/employees/deactivate/' + ${emp.id}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger" title="Deactivate" onclick="return confirm('Deactivate this employee?');">
                                            <i class="bi bi-person-x"></i>
                                        </button>
                                    </form>
                                    <form th:unless="${emp.active}" th:action="@{'/employees/activate/' + ${emp.id}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-success" title="Activate">
                                            <i class="bi bi-person-check"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
