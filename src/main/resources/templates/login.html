<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="text-center mb-3">
            <i class="bi bi-building fs-1 text-primary"></i>
            <h3 class="mt-2">ExpensePro</h3>
            <p class="subtitle">Corporate Expense & Advance Settlement</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="username" name="username" class="form-control" placeholder="name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-navy py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </div>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small">New employee? </span>
            <a th:href="@{/register}" class="text-decoration-none fw-semibold">Register here</a>
        </div>

        <div class="mt-4 p-2 bg-light rounded text-muted small">
            <div class="fw-bold mb-1">Demo Credentials:</div>
            <div><span class="badge bg-secondary">Finance Admin:</span> finance@company.com / password123</div>
            <div class="mt-1"><span class="badge bg-secondary">Manager:</span> manager@company.com / password123</div>
            <div class="mt-1"><span class="badge bg-secondary">Employee:</span> employee@company.com / password123</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
