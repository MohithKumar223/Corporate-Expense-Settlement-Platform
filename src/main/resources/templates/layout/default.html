<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Expense Platform">Corporate Expense Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar" sec:authorize="isAuthenticated()">
            <div class="sidebar-header">
                <i class="bi bi-building"></i>
                <span>ExpensePro</span>
            </div>
            <nav class="sidebar-nav">
                <a th:href="@{/dashboard}" class="nav-link-sidebar">
                    <i class="bi bi-speedometer2"></i><span>Dashboard</span>
                </a>

                <!-- Employee & Manager -->
                <a th:href="@{/advances}" class="nav-link-sidebar">
                    <i class="bi bi-cash-stack"></i><span>Advances</span>
                </a>
                <a th:href="@{/expenses}" class="nav-link-sidebar">
                    <i class="bi bi-receipt"></i><span>Expenses</span>
                </a>
                <a th:href="@{/settlements}" class="nav-link-sidebar">
                    <i class="bi bi-calculator"></i><span>Settlements</span>
                </a>

                <!-- Manager / Finance -->
                <div sec:authorize="hasAnyRole('MANAGER','FINANCE_ADMIN')">
                    <div class="sidebar-divider"></div>
                    <span class="sidebar-heading">Approvals</span>
                    <a th:href="@{/approvals}" class="nav-link-sidebar">
                        <i class="bi bi-check2-circle"></i><span>Pending Approvals</span>
                    </a>
                </div>

                <!-- Finance Admin Only -->
                <div sec:authorize="hasRole('FINANCE_ADMIN')">
                    <div class="sidebar-divider"></div>
                    <span class="sidebar-heading">Finance</span>
                    <a th:href="@{/employees}" class="nav-link-sidebar">
                        <i class="bi bi-people"></i><span>Employees</span>
                    </a>
                    <a th:href="@{/policies}" class="nav-link-sidebar">
                        <i class="bi bi-shield-check"></i><span>Policies</span>
                    </a>
                    <a th:href="@{/disbursements}" class="nav-link-sidebar">
                        <i class="bi bi-wallet2"></i><span>Disbursements</span>
                    </a>
                    <a th:href="@{/exceptions}" class="nav-link-sidebar">
                        <i class="bi bi-exclamation-triangle"></i><span>Exceptions</span>
                    </a>
                    <a th:href="@{/analytics}" class="nav-link-sidebar">
                        <i class="bi bi-graph-up"></i><span>Analytics</span>
                    </a>
                    <a th:href="@{/audit}" class="nav-link-sidebar">
                        <i class="bi bi-journal-text"></i><span>Audit Log</span>
                    </a>
                </div>

                <div class="sidebar-divider"></div>
                <a th:href="@{/notifications}" class="nav-link-sidebar">
                    <i class="bi bi-bell"></i><span>Notifications</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="main-content">
            <!-- Top Navbar -->
            <nav class="top-navbar" sec:authorize="isAuthenticated()">
                <button class="btn btn-link sidebar-toggle" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <div class="navbar-right">
                    <a th:href="@{/notifications}" class="btn btn-link position-relative">
                        <i class="bi bi-bell"></i>
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-link dropdown-toggle user-menu" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i>
                            <span sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text" sec:authentication="principal.role">Role</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right"></i> Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Flash messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-x-circle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${warnings}" class="alert alert-warning alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <ul class="mb-0">
                        <li th:each="w : ${warnings}" th:text="${w}"></li>
                    </ul>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div layout:fragment="content"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <div layout:fragment="scripts"></div>
</body>
</html>
