<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>Advance Requests</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <div>
                <h2>Advance Requests</h2>
                <p class="text-muted mb-0">Manage and track travel and business advance requests</p>
            </div>
            <div>
                <a th:href="@{/advances/create}" class="btn btn-navy">
                    <i class="bi bi-plus-lg me-1"></i> New Request
                </a>
            </div>
        </div>

        <div class="data-table-wrapper">
            <div class="table-header">
                <h5>All Requests</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="tableSearch" class="form-control form-control-sm" placeholder="Search requests..." style="max-width: 200px;">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table align-middle" id="dataTable">
                    <thead>
                        <tr>
                            <th>Request #</th>
                            <th sec:authorize="hasRole('FINANCE_ADMIN')">Employee</th>
                            <th>Purpose</th>
                            <th>Amount</th>
                            <th>Request Date</th>
                            <th>Needed By</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(advances)}">
                            <td colspan="8" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-3 d-block mb-1"></i> No advance requests found
                            </td>
                        </tr>
                        <tr th:each="adv : ${advances}">
                            <td class="fw-bold" th:text="${adv.requestNumber}">ADV-101</td>
                            <td sec:authorize="hasRole('FINANCE_ADMIN')">
                                <div class="fw-semibold" th:text="${adv.employee.fullName}">Employee</div>
                                <div class="small text-muted" th:text="${adv.department}">Dept</div>
                            </td>
                            <td>
                                <div class="fw-medium" th:text="${adv.purpose}">Purpose</div>
                                <div class="small text-muted text-truncate" style="max-width: 200px;" th:text="${adv.justification}">Details</div>
                            </td>
                            <td class="fw-bold text-navy">₹<span th:text="${#numbers.formatDecimal(adv.requestedAmount, 1, 'COMMA', 2, 'POINT')}">10,000</span></td>
                            <td th:text="${#temporals.format(adv.requestDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                            <td th:text="${adv.neededByDate != null ? #temporals.format(adv.neededByDate, 'dd MMM yyyy') : '-'}">-</td>
                            <td>
                                <span class="badge-status"
                                      th:classappend="${'badge-' + #strings.toLowerCase(#strings.replace(adv.status, '_', ''))}"
                                      th:text="${adv.status}">DRAFT</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{'/advances/view/' + ${adv.id}}" class="btn btn-outline-primary" title="View Details">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <form th:if="${adv.status.name() == 'DRAFT'}" th:action="@{'/advances/submit/' + ${adv.id}}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-success" title="Submit Request">
                                            <i class="bi bi-send"></i>
                                        </button>
                                    </form>
                                    <a th:if="${adv.status.name() == 'APPROVED'}" sec:authorize="hasRole('FINANCE_ADMIN')" th:href="@{'/disbursements/create/' + ${adv.id}}" class="btn btn-outline-warning" title="Disburse Funds">
                                        <i class="bi bi-wallet2"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
