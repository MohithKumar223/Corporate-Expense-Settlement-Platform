<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Access Denied</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 text-center">
                <div class="card p-5 border-0 shadow-sm">
                    <i class="bi bi-shield-slash text-danger" style="font-size: 4rem;"></i>
                    <h2 class="mt-3 text-navy">403 - Access Denied</h2>
                    <p class="text-muted mt-2">
                        You do not have permission to access this resource. If you believe this is an error, please contact your Finance Administrator.
                    </p>
                    <div class="mt-4">
                        <a th:href="@{/dashboard}" class="btn btn-navy px-4">
                            <i class="bi bi-house me-1"></i> Return to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
