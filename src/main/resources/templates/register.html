<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card" style="max-width: 500px;">
        <div class="text-center mb-3">
            <i class="bi bi-person-plus fs-1 text-primary"></i>
            <h3 class="mt-2">Create Account</h3>
            <p class="subtitle">Join Corporate Expense & Settlement Portal</p>
        </div>

        <form th:action="@{/register}" th:object="${employee}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="John Doe" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Employee Code *</label>
                    <input type="text" th:field="*{employeeCode}" class="form-control" placeholder="EMP100" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('employeeCode')}" th:errors="*{employeeCode}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address *</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john.doe@company.com" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Department *</label>
                    <select th:field="*{department}" class="form-select" required>
                        <option value="">Select Department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Human Resources">Human Resources</option>
                        <option value="Finance">Finance</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Designation *</label>
                    <input type="text" th:field="*{designation}" class="form-control" placeholder="Software Engineer" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password * (min 6 characters)</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required minlength="6">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-navy py-2">
                    <i class="bi bi-check2-circle me-1"></i> Register Employee
                </button>
            </div>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small">Already registered? </span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Sign in here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
